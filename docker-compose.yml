x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "3000:3000"
    environment:
      - ROOT_URL=${ROOT_URL:-http://localhost:3000}
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/carpool?authSource=admin
      - PORT=3000
      - NODE_ENV=production
      # Clerk server secret (also accepted from settings.private.clerk.secretKey)
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      # Persona identity-verification webhook signing secret
      - PERSONA_WEBHOOK_SECRET=${PERSONA_WEBHOOK_SECRET}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # Push Notification Configuration
      - NOTIFICATION_BACKEND=${NOTIFICATION_BACKEND:-firebase}
      # Firebase Configuration
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      # OneSignal Configuration
      - ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID}
      - ONESIGNAL_API_KEY=${ONESIGNAL_API_KEY}
      # Web Push Configuration
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      # Email Configuration
      - MAIL_URL=${MAIL_URL}
      # Legacy SMTP variables (not used if MAIL_URL is set)
      - SMTP_SERVER=${SMTP_SERVER:-smtp.mail.me.com}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - ./config/settings.json:/settings.json:ro
    depends_on:
      mongo:
        condition: service_healthy
      tileserver-gl:
        condition: service_started
      nominatim:
        condition: service_started
      osrm:
        condition: service_started
    restart: unless-stopped
    networks:
      - carpool_network
    mem_limit: 1g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

  mongo:
    image: mongo:7
    container_name: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ./mongo_data:/data/db
    restart: unless-stopped
    networks:
      - carpool_network
    mem_limit: 1g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # One-shot/looping mongodump backup. Start with:
  #   docker compose --profile backup up -d mongo-backup
  # Dumps land in ./backups, one directory per day.
  mongo-backup:
    image: mongo:7
    container_name: mongo-backup
    environment:
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - bash
      - -c
      - >
        while true; do
          mongodump --uri="mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/carpool?authSource=admin"
            --out="/backups/$$(date +%Y-%m-%d)";
          sleep 86400;
        done
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["backup"]
    networks:
      - carpool_network
    logging: *default-logging

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=false
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["manual"]
    networks:
      - carpool_network
    logging: *default-logging

  tileserver-gl:
    image: "maptiler/tileserver-gl:latest"
    container_name: tileserver-gl
    command:
      - --port
      - "8082"
      - --config
      - "/style/config.json"
    volumes:
      - ./openmaptilesdata/data:/data
      - ./openmaptilesdata/style:/style
      - ./openmaptilesdata/build:/build
    restart: unless-stopped
    networks:
      - carpool_network
    mem_limit: 1g
    logging: *default-logging
    healthcheck:
      test:
        ["CMD", "node", "-e", "require('net').connect({host: '127.0.0.1', port: 8082}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nominatim:
    container_name: nominatim
    image: mediagis/nominatim:5.1
    environment:
      - PBF_PATH=/nominatim/data/north-america/canada/${REGION:-british-columbia}.osm.pbf
    volumes:
      - ./openmaptilesdata/data:/nominatim/data
      - ./pgdataNominatimInternal:/var/lib/postgresql/16/main
    restart: unless-stopped
    networks:
      - carpool_network
    mem_limit: 4g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  osrm:
    container_name: osrm
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/${REGION:-british-columbia}.osrm --port 8083
    volumes:
      - ./osrmdata/data:/data
    restart: unless-stopped
    networks:
      - carpool_network
    mem_limit: 2g
    logging: *default-logging
    healthcheck:
      # osrm-routed has no dedicated /health route; a 2xx/4xx on any routing
      # endpoint proves the HTTP server is up and answering requests.
      test: ["CMD-SHELL", "wget -qO- --server-response http://127.0.0.1:8083/nearest/v1/driving/0,0 2>&1 | grep -qE 'HTTP/[0-9.]+ [24][0-9]{2}'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - app
      - tileserver-gl
      - nominatim
      - osrm
    restart: unless-stopped
    networks:
      - carpool_network
    logging: *default-logging

# Environment Variables:
# ROOT_URL - Application URL for email links and client routing
#           Development: http://localhost:3000 (default)
#           Production: https://carp.school
#           Example: ROOT_URL=https://carp.school docker compose up
#
# REGION - Sets the region name for data files (default: british-columbia)
#          Should match your PBF and OSRM data filenames
#          Example: REGION=alberta docker compose up
#
# MONGO_USER / MONGO_PASSWORD - Required. Mongo root credentials, also used
#                         to build the app's MONGO_URL and mongo-backup.
#
# MONGO_EXPRESS_USERNAME - Username for mongo-express (required, no default)
# MONGO_EXPRESS_PASSWORD - Password for mongo-express (required, no default)
#                         CHANGE THIS IN PRODUCTION!
#
# Push Notification Configuration:
# NOTIFICATION_BACKEND - Choose 'firebase' or 'onesignal' (default: firebase)
# FIREBASE_PROJECT_ID - Firebase project ID for push notifications
# FIREBASE_CLIENT_EMAIL - Firebase service account email
# FIREBASE_PRIVATE_KEY - Firebase service account private key
# ONESIGNAL_APP_ID - OneSignal application ID
# ONESIGNAL_API_KEY - OneSignal REST API key
# VAPID_PUBLIC_KEY - VAPID public key for web push notifications
# VAPID_PRIVATE_KEY - VAPID private key for web push notifications
#
# Email Configuration:
# MAIL_URL - Complete SMTP URL for email sending
#           Example: smtp://user%40icloud.com:app-password@smtp.mail.me.com:587
#           For iCloud+: smtp://main-email%40icloud.com:app-password@smtp.mail.me.com:587
#           Remember to URL encode @ as %40 in email addresses

networks:
  carpool_network:
    driver: bridge
