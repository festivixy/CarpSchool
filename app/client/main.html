  <!--
    Read by anything that does not execute JavaScript. Keep it short, accurate
    and in step with the real pages it links to -- a filter or a reviewer
    deciding what this domain is will often see only this.
  -->
  <noscript>
    <h1>CarpSchool</h1>
    <p>CarpSchool is a carpool service for school communities. Students, parents and staff at a registered school share rides to and from school. Accounts are verified against a school email address and approved by a school administrator.</p>
    <p>
      CarpSchool is used by school communities to arrange lifts to and from
      school. It is not a taxi service: nobody is dispatched or paid, no ride
      is priced, and CarpSchool carries no insurance. Rides are arranged
      between people who share a school.
    </p>
    <p>
      Accounts are not open to the public. A student verifies an email address
      on a domain belonging to a registered school, a parent or guardian joins
      by invitation from their student, and a school administrator approves
      every account before it can see or post anything.
    </p>
