name: Build Meteor Server Bundle

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        # Meteor 3.3.1 requires Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Meteor and npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.meteor
            ~/.npm
          key: ${{ runner.os }}-meteor-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-meteor-

      - name: Install Meteor
        run: curl -fsSL https://install.meteor.com/?release=3.3.1 | sh

      - name: Install app dependencies
        run: |
          cd app
          npm ci --legacy-peer-deps

      - name: Lint
        # The lint suite has a large backlog of pre-existing errors; this
        # step is informational until that backlog is cleared.
        continue-on-error: true
        run: |
          cd app
          npm run lint

      - name: Test
        run: |
          cd app
          npm test --if-present

      - name: Build Meteor app for server
        run: |
          cd app
          # Use --architecture os.linux.x86_64 for a standard Linux server deployment
          meteor build ../build --architecture os.linux.x86_64 --server-only

      - name: Check build dir
        run: |
          ls -la build

      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteor-bundle-${{ github.sha }}
          path: build/app.tar.gz
          retention-days: 7
